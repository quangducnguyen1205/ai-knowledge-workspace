# Product copy for the authentication host.
#
# Only keys whose upstream wording is generic ("your account"), infrastructure-flavoured, or
# inconsistent with the product's own voice are overridden; everything else falls through to the
# parent bundle so a Keycloak upgrade keeps improving the wording this theme does not own.
#
# The rule these follow: a signed-out visitor should never have to know the words realm, client,
# identity provider, OIDC, JWT or Keycloak to understand what happened. Technical vocabulary is
# allowed only where an operator, not a visitor, is the reader.

# Sign in
loginAccountTitle=Sign in to your workspace
doLogIn=Sign in
usernameOrEmail=Email
username=Email
email=Email
password=Password
rememberMe=Keep me signed in
doForgotPassword=Forgot your password?

# The credential failures stay deliberately non-enumerating, matching the product's own sign-in
# copy: an unknown account and a wrong password must not be distinguishable from the outside.
invalidUserMessage=Email or password is incorrect.
invalidUsernameMessage=Email or password is incorrect.
invalidUsernameOrEmailMessage=Email or password is incorrect.
invalidPasswordMessage=Email or password is incorrect.
invalidEmailMessage=Enter a valid email address.
accountDisabledMessage=This account cannot be used to sign in. Contact your administrator.
accountTemporarilyDisabledMessage=Too many attempts. Wait a moment and try again.
missingUsernameMessage=Enter your email address.
missingPasswordMessage=Enter your password.

# Create an account
noAccount=New to AI Knowledge Workspace?
doRegister=Create an account
registerTitle=Create your account
registerWithTitle=Create your account
passwordConfirm=Confirm password
backToLogin=Back to sign in
missingEmailMessage=Enter your email address.
emailExistsMessage=That email is already registered. Sign in instead.
usernameExistsMessage=That email is already registered. Sign in instead.
notMatchPasswordMessage=Those passwords do not match.
invalidPasswordMinLengthMessage=Use a password of at least {0} characters.
requiredFields=Required

# Continuing back to the product
backToApplication=Back to AI Knowledge Workspace
proceedWithAction=Continue to your workspace

# Something went wrong.
# A visitor who cannot start sign in needs to know what to do next, not which piece of
# configuration is wrong; the operator reads the server log, where the detail already is.
errorTitle=Something went wrong
clientNotFoundMessage=Sign in could not be started. Return to AI Knowledge Workspace and try again.
clientDisabledMessage=Sign in could not be started. Return to AI Knowledge Workspace and try again.
invalidRedirectUriMessage=Sign in could not be started. Return to AI Knowledge Workspace and try again.
invalidParameterMessage=Sign in could not be started. Return to AI Knowledge Workspace and try again.
pageExpiredTitle=This page is no longer active
pageExpiredMsg1=To start over,
pageExpiredMsg2=to continue,
doClickHere=start again
pageNotFound=We could not find that page
internalServerError=Something went wrong on our side. Try again in a moment.
unexpectedErrorHandlingRequestMessage=Sign in could not be completed. Try again.
identityProviderUnexpectedErrorMessage=Sign in could not be completed. Try again.
sessionLimitExceeded=You are signed in on too many devices.
expiredCodeMessage=That sign-in attempt timed out. Start again.
expiredActionMessage=That link has expired. Start again.
expiredActionTokenNoSessionMessage=That link has expired. Start again.
expiredActionTokenSessionExistsMessage=That link has expired. Try again.
cookieNotFoundMessage=Your browser blocked a cookie this sign-in needs. Enable cookies for this site and try again.

# Card footer, shown on every page of the flow.
p3PrivacyReassurance=Your videos remain private to your account.
