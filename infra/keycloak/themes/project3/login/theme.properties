# AI Knowledge Workspace — Keycloak login theme.
#
# Keycloak hosts authentication; the product owns the experience around it. This theme exists so
# the hop to the identity host does not look like a hop to a different website.
#
# It inherits `base`, which ships the login/register/error/info templates with no styling of its
# own and injects every class name from the `kc*` properties below. That is why this theme
# contains no copied upstream templates: naming the classes here is enough to restyle every page
# the realm can reach, and a Keycloak upgrade brings improved templates with it instead of
# leaving a fork behind. The one template override is `footer.ftl`, which upstream deliberately
# ships empty as a customisation point.
#
# Class names are the product's own, so `resources/css/project3.css` reads as a stylesheet rather
# than as a set of overrides fighting PatternFly.
parent=base

styles=css/project3.css
scripts=js/field-errors.js

meta=viewport==width=device-width,initial-scale=1

# The realm does not enable internationalisation, so the locale switcher never renders and only
# the English bundle is reachable. Adding a language here without enabling it on the realm would
# ship copy nobody can see.
locales=en

kcHtmlClass=p3-html
kcBodyClass=p3-body
kcLoginClass=p3-page

# Brand lockup above the card. The markup comes from the realm's displayNameHtml so the product
# name lives in realm configuration rather than in a template.
kcHeaderClass=p3-brand
kcHeaderWrapperClass=p3-brand__lockup

kcFormCardClass=p3-card
kcFormHeaderClass=p3-card__header
kcContentWrapperClass=p3-content
kcContainerClass=p3-container
kcContentClass=p3-content

## Form structure
kcFormClass=p3-form
kcFormGroupClass=p3-field
kcFormGroupErrorClass=p3-field--invalid
kcFormGroupHeader=p3-field__group-header
kcLabelClass=p3-label
kcLabelWrapperClass=p3-label-row
kcInputClass=p3-input
kcInputGroup=p3-input-group
kcInputGroupItemClass=p3-input-group__item
kcInputWrapperClass=p3-input-wrap
kcInputErrorMessageClass=p3-field__error
kcInputHelperTextBeforeClass=p3-field__help
kcInputHelperTextAfterClass=p3-field__help
kcTextareaClass=p3-input p3-input--textarea

kcFormOptionsClass=p3-form-options
kcFormOptionsWrapperClass=p3-form-options__links
kcFormSettingClass=p3-form-settings
kcFormButtonsClass=p3-form-buttons
kcFormAreaClass=p3-form-area

## Buttons
kcButtonClass=p3-button
kcButtonPrimaryClass=p3-button--primary
kcButtonDefaultClass=p3-button--ghost
kcButtonBlockClass=p3-button--block
kcButtonLargeClass=p3-button--large

## Choice controls
kcCheckClass=p3-check
kcCheckInputClass=p3-check__input
kcCheckLabelClass=p3-check__label
kcCheckboxClass=p3-check
kcCheckboxInputClass=p3-check__input
kcCheckboxLabelClass=p3-check__label
kcInputClassCheckbox=p3-check
kcInputClassCheckboxInput=p3-check__input
kcInputClassCheckboxLabel=p3-check__label
kcInputClassRadio=p3-check
kcInputClassRadioInput=p3-check__input
kcInputClassRadioLabel=p3-check__label
kcInputClassRadioCheckboxLabelDisabled=p3-check--disabled

## Notices
kcAlertClass=p3-alert
kcAlertTitleClass=p3-alert__title
kcFeedbackErrorIcon=p3-alert__icon p3-alert__icon--error
kcFeedbackWarningIcon=p3-alert__icon p3-alert__icon--warning
kcFeedbackSuccessIcon=p3-alert__icon p3-alert__icon--success
kcFeedbackInfoIcon=p3-alert__icon p3-alert__icon--info

## Sign-up / info area under the form
kcSignUpClass=p3-aside
kcInfoAreaWrapperClass=p3-aside__inner
kcInfoAreaClass=p3-aside__inner

## Password visibility toggle (base ships the button and swaps these classes on its icon)
kcFormPasswordVisibilityButtonClass=p3-reveal
kcFormPasswordVisibilityIconShow=p3-reveal__icon p3-reveal__icon--show
kcFormPasswordVisibilityIconHide=p3-reveal__icon p3-reveal__icon--hide

## Restart-login affordance shown once a username has been attempted
kcResetFlowIcon=p3-restart-icon

kcSrOnlyClass=p3-sr-only
