spring:
  config:
    activate:
      on-profile: project3

workspace:
  security:
    # Same default as the base configuration, but reached the same way: a literal here silently
    # won every environment setting, so `WORKSPACE_CORE_SECURITY_AUTHENTICATION_MODE=keycloak_jwt`
    # was accepted, documented in `.env.example`, and then ignored by the only profile the product
    # actually runs under. Sessions stay the default; the knob now decides.
    authentication-mode: ${WORKSPACE_CORE_SECURITY_AUTHENTICATION_MODE:legacy_session}
  processing:
    request-relay:
      enabled: true
  search:
    indexing:
      auto-request-enabled: true
      recovery-enabled: true
    indexing-relay:
      enabled: true
  kafka:
    enabled: true
    processing-result-listener-enabled: true
    indexing-listener-enabled: true

integration:
  fastapi:
    base-url: http://127.0.0.1:8000
    assistant-read-timeout: 75s

outbox:
  recovery:
    enabled: true
