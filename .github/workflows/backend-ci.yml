name: backend-ci

# Clean-checkout validation for the Spring product core. Everything here runs without a secret,
# without Docker and without a persistent volume, so a pull request from a fork validates the same
# way a maintainer branch does. The expensive PostgreSQL and Elasticsearch suites stay in the
# separate, manually dispatched job below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: unit, architecture and config gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the whitespace gate below can diff against a real base commit.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Whitespace safety
        # Equivalent of the local `git diff --check` gate, scoped to what this run introduces:
        # the pull-request base for a PR, the previous commit for a push. Pre-existing whitespace
        # elsewhere in the tree is not this gate's business, so a clean checkout always starts green.
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ] && git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          if [ -z "$base" ]; then
            echo 'No base commit to compare against; nothing introduced by this run.'
            exit 0
          fi
          git diff --check "$base" HEAD

      - name: Unit, architecture and migration tests
        # Excludes the environment-gated PostgreSQL suite and the Docker-dependent IT profiles.
        run: mvn -B -f services/workspace-core/pom.xml test

      - name: Kafka runtime config check
        # `.env` is a private developer file and is never present in a clean checkout, so both
        # deployment gateways validate through the committed template instead. Nothing is copied
        # or generated: the checkout is exactly as tracked before and after this job.
        run: make kafka-config-check ENV_FILE=.env.example

      - name: Compose configuration renders
        run: docker compose --env-file .env.example -f infra/docker-compose.dev.yml config --quiet

      - name: Checkout is unchanged by the gateways
        # Proves the two steps above are read-only: no generated `.env`, no rendered artifact.
        run: |
          test ! -e .env
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }

  integration:
    name: disposable PostgreSQL and Elasticsearch suites
    # Deliberately opt-in: these start real containers and take far longer than the gate above.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: workspace_core
          POSTGRES_PASSWORD: workspace_core
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U workspace_core"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Playback progress and continue watching on real PostgreSQL
        env:
          WORKSPACE_CORE_IT_POSTGRES_URL: jdbc:postgresql://localhost:5434/postgres
          WORKSPACE_CORE_IT_POSTGRES_USER: workspace_core
          WORKSPACE_CORE_IT_POSTGRES_PASSWORD: workspace_core
        run: mvn -B -f services/workspace-core/pom.xml test -Dtest=AssetPlaybackProgressConcurrencyPostgresTest

      - name: Saved moment persistence on a disposable PostgreSQL container
        run: mvn -B -f services/workspace-core/pom.xml -Psaved-moment-it verify

      - name: Canonical transcript context on a disposable PostgreSQL container
        run: mvn -B -f services/workspace-core/pom.xml -Pcanonical-context-it verify

      - name: Search quality against a disposable Elasticsearch container
        run: mvn -B -f services/workspace-core/pom.xml -Psearch-quality-it verify
